<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문장실 · 강의실 입장</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1ef;color:#243d42;font:16px/1.6 "Malgun Gothic",sans-serif}header{background:#203d48;color:white;padding:14px 5%;font:bold 24px serif}main{max-width:520px;margin:8vh auto;padding:32px;background:white;border-top:4px solid #39776d}h1{font:32px serif}button,input{font:inherit;border:1px solid #a6b9b6;border-radius:5px;padding:8px}input{width:100%}label{display:block;margin:15px 0}button{cursor:pointer;background:white}.active,#enter{background:#24554d;color:white}#enter{width:100%;margin-top:10px}[hidden]{display:none}</style><header>문장실</header><main><h1>강의실 입장</h1><nav><button data-mode="student">학생 입장</button> <button data-mode="admin">관리자 계정 접속</button> <button data-mode="create">강의실 만들기</button></nav><form><label id="roomLabel">강의실 이름 (방번호)<input id="room" maxlength="80"></label><label id="titleLabel">강의실 이름<input id="course" maxlength="80"></label><label id="nameLabel">이름 (아이디)<input id="who" maxlength="80"></label><label><span id="pwLabel"></span><input id="pw" type="password" required maxlength="160"></label><p id="hint"></p><button id="enter"></button><p id="status" role="status"></p></form></main><script>const $=id=>document.getElementById(id);let mode;function show(m){mode=m;for(const b of document.querySelectorAll('nav button'))b.classList.toggle('active',b.dataset.mode===m);for(const [group,input,on] of [['roomLabel','room',m!=='create'],['titleLabel','course',m==='create'],['nameLabel','who',m==='student']]){$(group).hidden=!on;$(input).required=on}$('pwLabel').textContent=m==='student'?'교번 (비밀번호)':'강의실 관리자 비밀번호';$('pw').value='';$('pw').minLength=m==='create'?4:1;$('hint').textContent=m==='student'?'처음 입장하면 이 강의실에 내 원고가 생깁니다. 다음 수업에도 같은 이름과 교번으로 이어 쓰세요.':m==='create'?'강의실 이름이 방번호입니다. 학생에게 이 이름을 알려 주세요.':'';$('enter').textContent=m==='create'?'강의실 만들기':m==='admin'?'전체 원고 열기':'내 원고 열기';$('status').textContent=''}for(const b of document.querySelectorAll('nav button'))b.onclick=()=>show(b.dataset.mode);show('student');document.querySelector('form').onsubmit=async e=>{e.preventDefault();$('enter').disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,room:$('room').value,name:$('who').value,title:$('course').value,pass:$('pw').value})});let d=await r.json();if(!r.ok)throw Error(d.error);sessionStorage.setItem('roomSession',d.token);location.assign('/editor')}catch(e){$('status').textContent=e.message}finally{$('enter').disabled=false}};</script></html>
